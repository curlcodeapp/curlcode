name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm run test

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies supabase/migrations)
        run: supabase start

      - name: Write .env.local from local Supabase status
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$(supabase status -o json | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).API_URL')" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o json | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).ANON_KEY')" >> .env.local

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
